<svg xmlns="http://www.w3.org/2000/svg" width="820" height="250" viewBox="0 0 820 250" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; font-size: 15px; }
    .l { opacity: 0; animation: in .01s forwards; }
    @keyframes in { to { opacity: 1; } }
    .p { fill: #a78bfa; } .c { fill: #e5e7eb; } .o { fill: #67e8f9; } .g { fill: #86efac; } .d { fill: #6b7280; }
    .cur { animation: blink 1s steps(1) infinite; fill: #a78bfa; }
    @keyframes blink { 50% { opacity: 0; } }
    .glow { animation: glow 4s ease-in-out infinite; }
    @keyframes glow { 50% { opacity: .55; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0a1f"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect class="glow" x="1" y="1" width="818" height="248" rx="14" fill="none" stroke="url(#bd)" stroke-width="2"/>
  <rect x="2" y="2" width="816" height="246" rx="13" fill="url(#bg)"/>
  <circle cx="26" cy="24" r="6" fill="#ef4444"/><circle cx="46" cy="24" r="6" fill="#f59e0b"/><circle cx="66" cy="24" r="6" fill="#22c55e"/>
