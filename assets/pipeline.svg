<svg xmlns="http://www.w3.org/2000/svg" width="910" height="230" viewBox="0 0 910 230" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Fira Code', Consolas, monospace; fill: #e5e7eb; font-size: 14px; text-anchor: middle; }
    .sub { fill: #94a3b8; font-size: 11px; }
    .n { fill: #141026; stroke: #8b5cf6; stroke-width: 1.5; animation: pulse 3s ease-in-out infinite; }
    .n2 { stroke: #22d3ee; }
    @keyframes pulse { 50% { stroke-opacity: .35; } }
    .flow { fill: none; stroke: #8b5cf6; stroke-opacity: .25; stroke-width: 2; stroke-dasharray: 6 6; animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -12; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f0a1f"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect x="1" y="1" width="908" height="228" rx="14" fill="url(#bg)" stroke="#2a2250"/>

  <path id="a" class="flow" d="M130,110 C160,110 160,62 190,62 L300,62 C335,62 335,110 370,110 L480,110 L520,110 L630,110 L660,110 L760,110 L790,110 L890,110"/>
  <path id="b" class="flow" d="M130,110 C160,110 160,158 190,158 L300,158 C335,158 335,110 370,110"/>

  <g>
    <rect class="n" x="20" y="88" width="110" height="44" rx="10"/><text x="75" y="115">Query</text>
    <rect class="n n2" x="190" y="40" width="110" height="44" rx="10"/><text x="245" y="67">BM25</text>
    <rect class="n n2" x="190" y="136" width="110" height="44" rx="10"/><text x="245" y="163">Dense</text>
    <rect class="n" x="370" y="88" width="110" height="44" rx="10"/><text x="425" y="115">RRF</text>
    <rect class="n n2" x="520" y="88" width="110" height="44" rx="10"/><text x="575" y="115">Rerank</text>
    <rect class="n" x="660" y="88" width="100" height="44" rx="10"/><text x="710" y="115">LLM</text>
    <rect class="n n2" x="790" y="88" width="100" height="44" rx="10"/><text x="840" y="115">RAGAS</text>
  </g>

  <text class="sub" x="245" y="30">sparse</text>
  <text class="sub" x="245" y="202">semantic</text>
  <text class="sub" x="425" y="152">fusion</text>
  <text class="sub" x="575" y="152">cross-encoder</text>
  <text class="sub" x="710" y="152">grounded answer</text>
  <text class="sub" x="840" y="152">faithfulness / MRR</text>

  <g>
    <circle r="9" fill="#a78bfa" filter="url(#g)"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#a"/></animateMotion></circle>
    <circle r="4" fill="#fff"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#a"/></animateMotion></circle>
    <circle r="9" fill="#22d3ee" filter="url(#g)"><animateMotion dur="5s" begin="-2.5s" repeatCount="indefinite"><mpath href="#a"/></animateMotion></circle>
    <circle r="4" fill="#fff"><animateMotion dur="5s" begin="-2.5s" repeatCount="indefinite"><mpath href="#a"/></animateMotion></circle>
    <circle r="7" fill="#22d3ee" filter="url(#g)"><animateMotion dur="2.2s" begin="-1s" repeatCount="indefinite"><mpath href="#b"/></animateMotion></circle>
    <circle r="3" fill="#fff"><animateMotion dur="2.2s" begin="-1s" repeatCount="indefinite"><mpath href="#b"/></animateMotion></circle>
  </g>
</svg>
